<!DOCTYPE html>
<html lang="en" data-accent="bordeaux" data-theme="light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<meta name="description" content="Hayneko — 一份关于代码、物理与动画的个人刊物。">
	<meta name="keyword" content="Hayneko, haynekogithubio, blog, web development, acg, programmer, 博客, 个人网站, 二次元, miku, physics simulation">
	<title>Hayneko</title>

	<link rel="icon" href="medias/pictures/miku.JPG" sizes="32x32">
	<link rel="manifest" href="manifest.json">
	<meta name="mobile-web-app-capable" content="yes">

	<link rel="stylesheet" href="styles/tokens.css">
	<link rel="stylesheet" href="styles/base.css">
	<link rel="stylesheet" href="styles/components.css">
	<link rel="stylesheet" href="styles/dock.css">
	<link rel="stylesheet" href="styles/pages.css">
	<link rel="stylesheet" href="styles/games.css">
	<link rel="stylesheet" href="views/cs-range/game.css?v=20261020o">
	<link rel="stylesheet" href="views/horizon/horizon.css">
	<link rel="stylesheet" href="styles/motion.css">
	<link rel="stylesheet" href="styles/labs-vm.css">

	<!-- 国际化配置: 必须在 i18n.js 之前定义 -->
	<script>
		window.I18N_CONFIG = {
			defaultLocale: 'en',
			locales: ['en', 'zh-CN', 'zh-TW', 'ja', 'ko'],
			basePath: 'i18n/',
			detect: true,
			persist: true,
			debug: false
		};
	</script>

	<!--
		设备分级: 必须在所有动效层之前算好, 所以它是**阻塞**脚本。
		(它只做同步探测、不碰 DOM, 几百字节; 换来的是后面每个动效模块都不用自己判断设备。)
	-->
	<script src="scripts/perf-tier.js"></script>

	<script src="scripts/motion-pref.js" defer></script>
	<script src="scripts/i18n.js" defer></script>
	<script src="scripts/smear.js" defer></script>
	<script src="scripts/motion.js" defer></script>
	<script src="scripts/router.js" defer></script>
	<script src="scripts/terminal.js" defer></script>
	<script src="scripts/games.js" defer></script>
	<!-- Hayneko_Arch32S 引擎(vm.py/as.py 的移植) + ~~/labs/vm 调试器界面 -->
	<script src="scripts/hayneko-arch32.js" defer></script>
	<script src="scripts/labs-vm.js" defer></script>
	<script src="scripts/dock.js" defer></script>
	<script src="views/cs-range/bootstrap.js?v=20261020o" defer></script>
	<script src="views/horizon/bootstrap.js" defer></script>
	<script src="scripts/app.js" defer></script>
</head>
<body>
	<a class="skip-link" href="#main" i18n-key="a11y.skip">Skip to content</a>

	<!-- ===================== 纸张 / 墨 ===================== -->
	<div class="board" aria-hidden="true"></div>

	<!-- ===================== 主体 ===================== -->
	<main class="site-main" id="main">
		<div class="route-progress" id="route-progress" aria-hidden="true"><i></i></div>
		<div class="page wrap" id="page" data-route="" data-state="idle" aria-live="polite">
			<div class="page__loader"><span i18n-key="a11y.loading">Opening</span></div>
		</div>
	</main>

	<!-- ===================== 版权页 ===================== -->
	<footer class="colophon">
		<div class="colophon__inner wrap">
			<span class="colophon__brand">Hayneko</span>
			<span i18n-key="footer.text.0">© Hayneko. First published 10 January 2026.</span>
			<span class="colophon__spacer"></span>
			<a href="https://github.com/hayNeko" target="_blank" rel="noopener noreferrer">github.com/hayNeko</a>
			<span class="colophon__dot" aria-hidden="true"></span>
			<span i18n-key="footer.status">online</span>
		</div>
	</footer>

	<!-- ===================== 开机页 ===================== -->
	<div class="boot" id="boot-screen">
		<div class="boot__inner">
			<p class="boot__flag">HAYNEKO</p>
			<p class="boot__sub" i18n-key="boot.sub">A personal magazine about code, physics and animation.</p>
			<div class="boot__bar"><i></i></div>
			<ul class="boot__log"></ul>
		</div>
	</div>

	<noscript>
		<div class="noscript">
			<p><strong>This issue needs JavaScript.</strong></p>
			<p>页面切换、终端与 Canvas 都由 JavaScript 驱动。</p>
		</div>
	</noscript>

	<script>
		/* 旧站注册过 service worker, 缓存的是旧文件列表。
		   这里主动注销, 避免更新后仍然命中旧缓存。 */
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.getRegistrations().then(function (regs) {
				regs.forEach(function (r) { r.unregister(); });
			}).catch(function () {});
		}
	</script>
</body>
</html>
