<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<title>牛頓第二定律 · Hayneko Labs</title>

	<link rel="icon" href="../../../medias/pictures/miku.JPG" sizes="32x32">
	<link rel="stylesheet" href="../../../styles/tokens.css">
	<link rel="stylesheet" href="../../../styles/lab.css">
</head>
<body>
<div class="lab-page">
	<header class="lab-head">
		<span class="lab-head__prompt">hayneko</span><span>:</span><span class="lab-head__path">~/labs/newton2</span>
		<span class="lab-head__spacer"></span>
		<span class="lab-head__tag">labs · v1.1</span>
		<a class="lab-back" href="../../../index.html#/labs">← 返回實驗室</a>
	</header>

	<h1 class="lab-title">牛頓第二定律：F<sub>net</sub> = ma 動態模擬</h1>
	<p class="lab-sub">拖動搖桿施加外力，放手歸零。左邊是即時畫面，右邊是速度與位移曲線。</p>

	<div id="main-container">
		<div id="left-panel">
			<div id="info" class="info">
				質量 m: <span id="mass-display">1.0</span> kg　|　摩擦係數 μ: <span id="friction-display">0.13</span><br>
				淨力 F<sub>net</sub>: <span id="force-display">0.00</span> N　|　加速度 a: <span id="accel-display">0.00</span> m/s²<br>
				速度 v: <span id="vel-display">0.00</span> m/s
			</div>

			<div class="control-group">
				<label for="mass-input">質量 (kg)</label>
				<input type="range" id="mass-input" min="0.1" max="10" step="0.1" value="1.0">
			</div>
			<div class="control-group">
				<label for="friction-input">摩擦係數</label>
				<input type="range" id="friction-input" min="0" max="1.0" step="0.01" value="0.125">
			</div>

			<canvas id="mechanicsCanvas" width="500" height="150"></canvas>

			<div id="joystick-container" role="slider" tabindex="0" aria-label="施力搖桿"
				aria-valuemin="-50" aria-valuemax="50" aria-valuenow="0" aria-valuetext="外力 0 N">
				<div id="joystick-handle"></div>
			</div>
			<div id="joystick-text">拖動搖桿施加外力（放手歸零）　當前 <b id="force-ext">0.0 N</b></div>

			<button id="export-btn" type="button">下載數據 (.csv)</button>
		</div>

		<div id="right-panel">
			<div class="graph-container">
				<h2>速度 — 時間 (v-t)</h2>
				<canvas id="vtGraph" width="550" height="220"></canvas>
			</div>
			<div class="graph-container">
				<h2>累積位移 — 時間 (s-t)</h2>
				<canvas id="stGraph" width="550" height="220"></canvas>
			</div>
		</div>
	</div>
</div>

<script>
	var canvas = document.getElementById("mechanicsCanvas");
	var ctx = canvas.getContext("2d");
	var joystickContainer = document.getElementById("joystick-container");
	var joystickHandle = document.getElementById("joystick-handle");
	var forceExtOut = document.getElementById("force-ext");
	var vtCtx = document.getElementById("vtGraph").getContext("2d");
	var stCtx = document.getElementById("stGraph").getContext("2d");

	var mass = 1.0;
	var frictionCoeff = 0.125;
	var F_ext = 0, F_net = 0, acceleration = 0, velocity = 0;
	var displayPos = 250, accumulatedPos = 0;
	var MAX_FORCE = 50, PIXELS_PER_METER = 20;
	var timeData = [], velData = [], posData = [], globalTime = 0;

	/* 画布：按 CSS 宽度 × DPR 重设一次，300 宽的屏也不糊 */
	function sizeCanvas(cv, cssH) {
		var dpr = window.devicePixelRatio || 1;
		var w = cv.clientWidth || cv.width;
		cv.width = Math.round(w * dpr);
		cv.height = Math.round(cssH * dpr);
		cv.style.height = cssH + "px";
		cv.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
	}
	function fitAll() {
		sizeCanvas(canvas, 150);
		sizeCanvas(document.getElementById("vtGraph"), 200);
		sizeCanvas(document.getElementById("stGraph"), 200);
	}

	document.getElementById("mass-input").addEventListener("input", function (e) {
		mass = parseFloat(e.target.value);
		document.getElementById("mass-display").textContent = mass.toFixed(1);
	});
	document.getElementById("friction-input").addEventListener("input", function (e) {
		frictionCoeff = parseFloat(e.target.value);
		document.getElementById("friction-display").textContent = frictionCoeff.toFixed(2);
	});
	document.getElementById("export-btn").addEventListener("click", exportCSV);

	/* ---------------------------------------------------------------- 摇杆 */
	var isDragging = false;
	var dragDist = 0;   /* 实时量, 不再在加载时缓存 rect(那时布局还没定) */

	function jsMetrics() {
		var rect = joystickContainer.getBoundingClientRect();
		return {
			w: rect.width,
			cx: rect.left + rect.width / 2,
			max: Math.max(20, rect.width / 2 - 18)
		};
	}

	function setHandle(delta) {
		joystickHandle.style.left = (joystickContainer.getBoundingClientRect().width / 2 + delta) + "px";
		joystickHandle.style.transform = "translate(-50%, -50%)";
	}

	function applyDelta(delta) {
		var m = jsMetrics();
		var d = Math.max(-m.max, Math.min(delta, m.max));
		setHandle(d);
		F_ext = (d / m.max) * MAX_FORCE;
		forceExtOut.textContent = F_ext.toFixed(1) + " N";
		joystickContainer.setAttribute("aria-valuenow", Math.round(F_ext));
		joystickContainer.setAttribute("aria-valuetext", "外力 " + F_ext.toFixed(1) + " N");
	}

	function pointerDelta(e) {
		var clientX = e.touches ? e.touches[0].clientX : e.clientX;
		return clientX - jsMetrics().cx;
	}

	function startDrag(e) {
		if (e.button !== undefined && e.button !== 0) return;
		e.preventDefault();
		isDragging = true;
		joystickContainer.style.cursor = "grabbing";
		applyDelta(pointerDelta(e));
	}
	function moveDrag(e) {
		if (!isDragging) return;
		e.preventDefault();
		applyDelta(pointerDelta(e));
	}
	function stopDrag() {
		if (!isDragging) return;
		isDragging = false;
		joystickContainer.style.cursor = "grab";
		applyDelta(0);
	}

	joystickContainer.addEventListener("mousedown", startDrag);
	window.addEventListener("mousemove", moveDrag);
	window.addEventListener("mouseup", stopDrag);
	joystickContainer.addEventListener("touchstart", startDrag, { passive: false });
	window.addEventListener("touchmove", moveDrag, { passive: false });
	window.addEventListener("touchend", stopDrag);
	window.addEventListener("touchcancel", stopDrag);

	/* 键盘也能推摇杆(可聚焦, 不鼠标也行) */
	joystickContainer.addEventListener("keydown", function (e) {
		var step = e.shiftKey ? 10 : 2;
		if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
			e.preventDefault();
			var m = jsMetrics();
			var d = (F_ext / MAX_FORCE) * m.max + (e.key === "ArrowRight" ? step : -step);
			applyDelta(d);
			clearTimeout(joystickContainer._t);
			joystickContainer._t = setTimeout(function () { applyDelta(0); }, 900);
		} else if (e.key === "Escape" || e.key === " ") {
			e.preventDefault();
			applyDelta(0);
		}
	});

	/* ---------------------------------------------------------------- 物理 */
	var lastTime = 0;

	function gameLoop(timestamp) {
		if (!lastTime) lastTime = timestamp;
		var dt = (timestamp - lastTime) / 1000;
		lastTime = timestamp;
		if (dt > 0.1) dt = 0.1;

		updatePhysics(dt);
		drawSimulation();
		recordData(dt);
		drawGraph(vtCtx, velData, "v", "m/s", false);
		drawGraph(stCtx, posData, "s", "m", true);
		requestAnimationFrame(gameLoop);
	}

	function updatePhysics(dt) {
		var F_f = -frictionCoeff * velocity * 5;
		F_net = F_ext + F_f;
		acceleration = F_net / mass;
		velocity += acceleration * dt;
		if (Math.abs(velocity) < 0.01 && Math.abs(F_ext) < 0.1) velocity = 0;

		var deltaS = velocity * dt;
		accumulatedPos += deltaS;
		displayPos += deltaS * PIXELS_PER_METER;
		if (displayPos > 500) displayPos -= 500;
		if (displayPos < 0) displayPos += 500;

		document.getElementById("force-display").textContent = F_net.toFixed(2);
		document.getElementById("accel-display").textContent = acceleration.toFixed(2);
		document.getElementById("vel-display").textContent = velocity.toFixed(2);
	}

	function drawSimulation() {
		var w = canvas.clientWidth, h = 150;
		ctx.clearRect(0, 0, w, h);
		var groundY = h - 62;

		/* 画布是黑底: 笔画与文字用亮色, 不用深墨色 */
		ctx.strokeStyle = "rgba(226, 235, 244, 0.45)";
		ctx.lineWidth = 1;
		ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();

		ctx.fillStyle = "rgba(226, 235, 244, 0.4)";
		for (var i = 0; i <= w; i += 50) { ctx.fillRect(i, groundY - 4, 1, 8); }

		var size = 26 + mass * 2;
		var yPos = groundY - size;
		var x = displayPos * (w / 500) - size / 2;
		ctx.fillStyle = "#79a7cf";
		ctx.fillRect(x, yPos, size, size);
		ctx.strokeStyle = "rgba(226, 235, 244, 0.55)";
		ctx.lineWidth = 1;
		ctx.strokeRect(x + 0.5, yPos + 0.5, size - 1, size - 1);

		if (Math.abs(F_ext) > 0.5) drawArrow(x + size / 2, yPos + size / 2, F_ext * (w / 500) * 1.5, "#d9968c", "F");
		var F_f = -frictionCoeff * velocity * 5;
		if (Math.abs(F_f) > 0.5) drawArrow(x + size / 2, groundY + 12, F_f * (w / 500) * 1.5, "#9dc2a4", "f");
	}

	function drawArrow(x, y, length, color, label) {
		ctx.strokeStyle = color;
		ctx.fillStyle = color;
		ctx.lineWidth = 2;
		ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + length, y); ctx.stroke();
		var dir = length > 0 ? 1 : -1;
		ctx.beginPath();
		ctx.moveTo(x + length, y);
		ctx.lineTo(x + length - 6 * dir, y - 4);
		ctx.lineTo(x + length - 6 * dir, y + 4);
		ctx.fill();
		ctx.font = "11px ui-monospace, monospace";
		ctx.fillText(label, x + length / 2, y - 6);
	}

	function recordData(dt) {
		globalTime += dt;
		if (!timeData.length || globalTime - timeData[timeData.length - 1] > 0.05) {
			timeData.push(globalTime);
			velData.push(velocity);
			posData.push(accumulatedPos);
			if (timeData[timeData.length - 1] - timeData[0] > 20) {
				timeData.shift(); velData.shift(); posData.shift();
			}
		}
	}

	function drawGraph(gCtx, data, label, unit, isPos) {
		var cv = gCtx.canvas;
		var w = cv.clientWidth, h = 200;
		gCtx.clearRect(0, 0, w, h);
		if (data.length < 2) return;

		var maxVal = Math.max.apply(null, data.map(Math.abs));
		var minD = Math.min.apply(null, data);
		var maxD = Math.max.apply(null, data);
		var range = Math.max(maxD - minD, 1);
		var scaleY, zeroY;
		if (isPos) {
			scaleY = (h - 44) / range;
			zeroY = h / 2;
		} else {
			if (maxVal < 1) maxVal = 1;
			scaleY = (h / 2 - 22) / maxVal;
			zeroY = h / 2;
		}

		var scaleX = w / 20;
		var now = timeData[timeData.length - 1];

		gCtx.strokeStyle = "rgba(226, 235, 244, 0.22)";
		gCtx.lineWidth = 1;
		if (!isPos) {
			gCtx.beginPath(); gCtx.moveTo(0, zeroY); gCtx.lineTo(w, zeroY); gCtx.stroke();
		} else {
			gCtx.strokeRect(0.5, 0.5, w - 1, h - 1);
		}

		gCtx.strokeStyle = isPos ? "#9dc2a4" : "#8fb2d6";
		gCtx.lineWidth = 1.8;
		gCtx.beginPath();
		for (var i = 0; i < data.length; i++) {
			var x = w - (now - timeData[i]) * scaleX;
			var val = data[i];
			var y = isPos ? (h - 22 - (val - minD) * scaleY) : (zeroY - val * scaleY);
			if (i === 0) gCtx.moveTo(x, y); else gCtx.lineTo(x, y);
		}
		gCtx.stroke();

		/* 读数固定放左上, 刻度放右上/右下 —— 之前两边都靠右, 数值一贴上去就叠在一起 */
		gCtx.fillStyle = "rgba(226, 235, 244, 0.82)";
		gCtx.font = "11px ui-monospace, monospace";
		gCtx.textAlign = "left";
		gCtx.fillText("當前 " + data[data.length - 1].toFixed(2) + " " + unit, 8, 16);
		gCtx.fillStyle = "rgba(226, 235, 244, 0.5)";
		gCtx.fillText("20 s", 8, h - 8);
		gCtx.textAlign = "right";
		if (isPos) {
			gCtx.fillText("Max " + maxD.toFixed(1), w - 8, 16);
			gCtx.fillText("Min " + minD.toFixed(1), w - 8, h - 8);
		} else {
			gCtx.fillText("+" + maxVal.toFixed(1), w - 8, Math.max(14, zeroY - maxVal * scaleY));
			gCtx.fillText("-" + maxVal.toFixed(1), w - 8, Math.min(h - 6, zeroY + maxVal * scaleY + 12));
		}
		gCtx.textAlign = "left";
	}

	function exportCSV() {
		var csv = "Time(s),Velocity(m/s),Displacement(m)\n";
		for (var i = 0; i < timeData.length; i++) {
			csv += timeData[i].toFixed(3) + "," + velData[i].toFixed(3) + "," + posData[i].toFixed(3) + "\n";
		}
		var blob = new Blob([csv], { type: "text/csv" });
		var url = URL.createObjectURL(blob);
		var a = document.createElement("a");
		a.href = url;
		a.download = "physics_data.csv";
		a.click();
		URL.revokeObjectURL(url);
	}

	setHandle(0);
	window.addEventListener("resize", function () {
		fitAll();
		if (!isDragging) applyDelta(0);
	});
	fitAll();
	requestAnimationFrame(gameLoop);
</script>
</body>
</html>
