<!-- views/terminal.html -->
<header class="page-head">
	<h1 class="page-head__title" data-smear="drop" data-fx-split><span data-fx-text i18n-key="terminal.heading">Terminal</span></h1>
	<p class="page-head__sub" data-smear i18n-key="terminal.subtitle">Type <code>help</code> to see what this shell can do.</p>
</header>

<section class="section" style="margin-top:0">
	<div class="term" data-terminal data-smear>
		<div class="term__bar">
			<span class="term-window__dots" aria-hidden="true"><i></i><i></i><i></i></span>
			<span class="term__title">hayneko@blog: ~</span>
			<span class="term-window__tag" i18n-key="terminal.term.tag">interactive</span>
		</div>
		<div class="term__body" tabindex="-1"></div>
		<div class="term__prompt-line">
			<span class="term__ps1">hayneko@blog:~$</span>
			<input class="term__input" type="text" spellcheck="false" autocomplete="off"
				aria-label="terminal input" i18n-attr="aria-label" i18n-key="terminal.term.input">
		</div>
	</div>

	<div class="term-suggest" data-smear>
		<button type="button" data-cmd="help">help</button>
		<button type="button" data-cmd="ls">ls</button>
		<button type="button" data-cmd="cat about.md">cat about.md</button>
		<button type="button" data-cmd="sim">sim</button>
		<button type="button" data-cmd="play tetris">play tetris</button>
		<button type="button" data-cmd="play blockblast">play blockblast</button>
		<button type="button" data-cmd="calc (1+2)*3^2">calc</button>
		<button type="button" data-cmd="base 0xff">base</button>
		<button type="button" data-cmd="hash sha256 abc">hash</button>
		<button type="button" data-cmd="hex hello">hex</button>
		<button type="button" data-cmd="color #3ce07b">color</button>
		<button type="button" data-cmd="ts">ts</button>
		<button type="button" data-cmd="pass 20 -s">pass</button>
		<button type="button" data-cmd="cron &quot;*/15 9-17 * * 1-5&quot;">cron</button>
		<button type="button" data-cmd="env">env</button>
		<button type="button" data-cmd="neofetch">neofetch</button>
		<button type="button" data-cmd="matrix">matrix</button>
		<button type="button" data-cmd="theme light">theme light</button>
		<button type="button" data-cmd="accent blue">accent blue</button>
		<button type="button" data-cmd="clear">clear</button>
	</div>
</section>
