<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<title>透镜成像 · Hayneko Labs</title>

	<link rel="icon" href="../../../medias/pictures/miku.JPG" sizes="32x32">
	<link rel="stylesheet" href="../../../styles/tokens.css">
	<link rel="stylesheet" href="../../../styles/lab.css">
</head>
<body>
<div class="lab-page">
	<header class="lab-head">
		<span class="lab-head__prompt">hayneko</span><span>:</span><span class="lab-head__path">~/labs/lens</span>
		<span class="lab-head__spacer"></span>
		<span class="lab-head__tag">labs · v1.1</span>
		<a class="lab-back" href="../../../index.html#/labs">← 返回实验室</a>
	</header>

	<h1 class="lab-title">透镜成像：拖动黄色箭头，观察光路与像</h1>
	<p class="lab-sub">沿光轴拖动黄色箭头（物体）。焦点位置由滑杆给出，像的位置与大小实时算出。</p>

	<div class="lab-container">
		<div class="header">
			<div class="controls">
				<button id="convex-btn" class="btn active" type="button">凸透镜</button>
				<button id="concave-btn" class="btn" type="button">凹透镜</button>
			</div>
			<div class="controls">
				<div><label for="f-slider">焦距 f</label><input type="range" id="f-slider" min="40" max="200" value="50"></div>
				<button id="reset-btn" class="btn" type="button">重置</button>
			</div>
		</div>

		<div id="canvas-wrapper"><canvas id="opticsCanvas"></canvas></div>

		<div class="status-bar">
			<span id="info-badge">检测中…</span>
			<span id="stat-u">物距 u: --</span>
			<span id="stat-v">像距 v: --</span>
			<span id="stat-m">倍率 M: --</span>
		</div>
	</div>
</div>

<script>
	var canvas = document.getElementById("opticsCanvas");
	var ctx = canvas.getContext("2d");
	var fSlider = document.getElementById("f-slider");
	var infoBadge = document.getElementById("info-badge");
	var resetBtn = document.getElementById("reset-btn");

	var f = 50;
	var isConvex = true;
	var obj = { x: -200, y: -150 };
	var isDragging = false;
	var activeTouchId = null;
	var touchDragEnabled = false;

	function resetObj() { obj.x = -200; obj.y = -150; }
	resetBtn.onclick = resetObj;

	function resize() {
		var dpr = window.devicePixelRatio || 1;
		var w = canvas.clientWidth || 800;
		canvas.height = Math.max(220, Math.round(w * 0.42));
		canvas.width = Math.round(w * dpr);
		canvas.height = Math.round(canvas.height * dpr);
		canvas.style.height = (canvas.height / dpr) + "px";
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
	}
	window.addEventListener("resize", resize);

	function getCanvasCoordsFromClient(clientX, clientY) {
		var rect = canvas.getBoundingClientRect();
		return {
			x: clientX - rect.left - canvas.clientWidth / 2,
			y: clientY - rect.top - canvas.clientHeight / 2
		};
	}

	function onTouchStart(e) {
		e.preventDefault();
		if (!e.touches.length) return;
		var p = getCanvasCoordsFromClient(e.touches[0].clientX, e.touches[0].clientY);
		if (Math.abs(p.x - obj.x) < 120) {
			isDragging = true; touchDragEnabled = true; activeTouchId = e.touches[0].identifier;
			obj.x = Math.min(p.x, -10); obj.y = p.y;
		}
	}
	function onTouchMove(e) {
		if (!isDragging || !touchDragEnabled || activeTouchId === null) return;
		e.preventDefault();
		for (var i = 0; i < e.touches.length; i++) {
			if (e.touches[i].identifier !== activeTouchId) continue;
			var p = getCanvasCoordsFromClient(e.touches[i].clientX, e.touches[i].clientY);
			obj.x = Math.min(p.x, -10); obj.y = p.y;
			break;
		}
	}
	function onTouchEnd(e) {
		isDragging = false; touchDragEnabled = false; activeTouchId = null;
		e.preventDefault();
	}
	canvas.addEventListener("touchstart", onTouchStart, { passive: false });
	canvas.addEventListener("touchmove", onTouchMove, { passive: false });
	canvas.addEventListener("touchend", onTouchEnd);
	canvas.addEventListener("touchcancel", onTouchEnd);

	canvas.onmousedown = function (e) {
		var rect = canvas.getBoundingClientRect();
		var mx = e.clientX - rect.left - canvas.clientWidth / 2;
		if (Math.abs(mx - obj.x) < 120) isDragging = true;
	};
	window.onmouseup = function () { isDragging = false; };
	window.onmousemove = function (e) {
		if (!isDragging) return;
		var rect = canvas.getBoundingClientRect();
		obj.x = Math.min(e.clientX - rect.left - canvas.clientWidth / 2, -10);
		obj.y = e.clientY - rect.top - canvas.clientHeight / 2;
	};

	/* 纸 + 墨: 轴上细线、刻度点、三支光线用三种油墨色 */
	var INK = {
		axis: "rgba(226, 235, 244, 0.34)",
		mark: "rgba(226, 235, 244, 0.62)",
		obj: "#e0c060",
		img: "#8fb2d6",
		ray1: "#79a7cf",
		ray2: "#d9968c",
		ray3: "#9dc2a4",
		lens: "rgba(226, 235, 244, 0.85)"
	};

	function drawArrow(x, y1, y2, color, dashed) {
		ctx.save();
		ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
		if (dashed) ctx.setLineDash([7, 5]);
		ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
		ctx.setLineDash([]);
		var head = 11, sign = y2 >= y1 ? 1 : -1;
		ctx.beginPath();
		ctx.moveTo(x, y2);
		ctx.lineTo(x - 6, y2 - head * sign);
		ctx.lineTo(x + 6, y2 - head * sign);
		ctx.fill();
		ctx.restore();
	}

	function render() {
		var w = canvas.clientWidth, h = canvas.clientHeight;
		ctx.clearRect(0, 0, w, h);
		ctx.save();
		ctx.translate(w / 2, h / 2);

		ctx.strokeStyle = INK.axis;
		ctx.lineWidth = 1;
		ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2, 0); ctx.stroke();

		var marks = isConvex ? [-2 * f, -f, f, 2 * f] : [-f, f];
		ctx.font = "11px ui-monospace, monospace";
		ctx.textAlign = "center";
		marks.forEach(function (m) {
			ctx.fillStyle = INK.mark;
			ctx.beginPath(); ctx.arc(m, 0, 2.5, 0, 7); ctx.fill();
			ctx.fillText(Math.abs(m) === f ? "F" : "2F", m, 20);
		});

		var u = Math.abs(obj.x);
		var focal = isConvex ? f : -f;
		var v = 1 / (1 / focal - 1 / u);
		var M = -v / u;
		var imgY = M * obj.y;
		var isReal = v > 0;

		ctx.lineWidth = 1.4;

		ctx.strokeStyle = INK.ray1;
		ctx.beginPath(); ctx.moveTo(obj.x, obj.y); ctx.lineTo(0, obj.y); ctx.stroke();
		var slope1 = isConvex ? (0 - obj.y) / f : (obj.y - 0) / f;
		ctx.beginPath(); ctx.moveTo(0, obj.y); ctx.lineTo(w / 2, obj.y + slope1 * (w / 2)); ctx.stroke();
		if (!isReal) {
			ctx.save(); ctx.setLineDash([5, 5]);
			ctx.beginPath();
			if (isConvex) { ctx.moveTo(0, obj.y); ctx.lineTo(v, imgY); }
			else { ctx.moveTo(0, obj.y); ctx.lineTo(focal, 0); }
			ctx.stroke(); ctx.restore();
		}

		ctx.strokeStyle = INK.ray2;
		ctx.beginPath(); ctx.moveTo(obj.x, obj.y); ctx.lineTo(w / 2, (w / 2 / obj.x) * obj.y); ctx.stroke();
		if (!isReal) {
			ctx.save(); ctx.setLineDash([5, 5]);
			ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(v, imgY); ctx.stroke(); ctx.restore();
		}

		if (isConvex) {
			ctx.strokeStyle = INK.ray3;
			ctx.beginPath(); ctx.moveTo(obj.x, obj.y);
			var midY = (obj.y / (obj.x + f)) * f;
			ctx.lineTo(0, midY); ctx.lineTo(w / 2, midY); ctx.stroke();
			if (!isReal) {
				ctx.save(); ctx.setLineDash([5, 5]);
				ctx.beginPath(); ctx.moveTo(obj.x, obj.y); ctx.lineTo(-focal, 0); ctx.stroke(); ctx.restore();
			}
		}

		/* 透镜: 一条竖直细线 + 两端的箭头记号 */
		ctx.save();
		ctx.strokeStyle = INK.lens; ctx.lineWidth = 1.5;
		var lh = h - 8;
		ctx.beginPath(); ctx.moveTo(0, -lh / 2); ctx.lineTo(0, lh / 2); ctx.stroke();
		var arrow = 12;
		ctx.beginPath();
		if (isConvex) {
			ctx.moveTo(-arrow, -lh / 2 + arrow); ctx.lineTo(0, -lh / 2); ctx.lineTo(arrow, -lh / 2 + arrow);
			ctx.moveTo(-arrow, lh / 2 - arrow); ctx.lineTo(0, lh / 2); ctx.lineTo(arrow, lh / 2 - arrow);
		} else {
			ctx.moveTo(-arrow, -lh / 2); ctx.lineTo(0, -lh / 2 + arrow); ctx.lineTo(arrow, -lh / 2);
			ctx.moveTo(-arrow, lh / 2); ctx.lineTo(0, lh / 2 - arrow); ctx.lineTo(arrow, lh / 2);
		}
		ctx.stroke();
		ctx.restore();

		drawArrow(obj.x, 0, obj.y, INK.obj, false);
		if (!isNaN(v) && Math.abs(v) < 500000) {
			drawArrow(v, 0, imgY, INK.img, !isReal);
			updateUI(u, v, M, isReal);
		}

		ctx.restore();
		requestAnimationFrame(render);
	}

	function updateUI(u, v, M, isReal) {
		infoBadge.innerText = (isConvex ? "凸透镜" : "凹透镜") + (isReal ? " · 实像" : " · 虚像");
		document.getElementById("stat-u").innerText = "物距 u: " + Math.round(u);
		document.getElementById("stat-v").innerText = "像距 v: " + Math.round(v);
		document.getElementById("stat-m").innerText = "倍率 M: " + Math.abs(M).toFixed(2) + "×";
	}

	fSlider.oninput = function (e) { f = parseInt(e.target.value, 10); };
	document.getElementById("convex-btn").onclick = function () {
		isConvex = true; this.classList.add("active");
		document.getElementById("concave-btn").classList.remove("active");
	};
	document.getElementById("concave-btn").onclick = function () {
		isConvex = false; this.classList.add("active");
		document.getElementById("convex-btn").classList.remove("active");
	};

	resize();
	window.addEventListener("resize", resize);
	render();
</script>
</body>
</html>
